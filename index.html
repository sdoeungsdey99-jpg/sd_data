<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SD Data - ប្រព័ន្ធគ្រប់គ្រងទិន្នន័យ ERP</title>
  
  <!-- Google Fonts: Battambang & Kantumruy Pro -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#B91C1C', // ពណ៌ក្រហមជ្រៅ
              dark: '#991B1B',
              light: '#DC2626',
              soft: '#FEE2E2',
            }
          },
          fontFamily: {
            khmer: ['Kantumruy Pro', 'Battambang', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Kantumruy Pro', 'Battambang', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    
    /* Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Transition for Sidebar on mobile */
    .sidebar-transition {
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Force mobile container to never be squished */
    @media (max-width: 767px) {
      aside#sidebar.-translate-x-full {
        display: none !important;
      }
      aside#sidebar:not(.-translate-x-full) {
        display: flex !important;
      }
      main#main-content {
        padding: 0.75rem !important;
        width: 100vw !important;
        max-width: 100vw !important;
      }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 flex h-screen w-full overflow-hidden antialiased font-khmer text-sm">

  <!-- Mobile Overlay Backdrop -->
  <div id="mobile-overlay" 
       class="fixed inset-0 bg-black/50 z-40 hidden md:hidden transition-opacity duration-300 opacity-0"
       onclick="closeSidebar()">
  </div>

  <!-- Sidebar -->
  <aside id="sidebar" 
         class="fixed md:static inset-y-0 left-0 z-50 w-[70vw] max-w-[240px] md:w-60 bg-gradient-to-b from-[#EA580C] via-[#F97316] to-[#C2410C] text-white flex flex-col justify-between shadow-2xl md:shadow-lg -translate-x-full md:translate-x-0 sidebar-transition select-none relative overflow-hidden shrink-0">
    
    <!-- Liquid Ambient Glow Layers -->
    <div class="absolute -top-16 -left-16 w-48 h-48 bg-amber-300/25 rounded-full blur-2xl pointer-events-none"></div>
    <div class="absolute top-1/3 -right-20 w-56 h-56 bg-orange-400/30 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-16 -left-10 w-44 h-44 bg-red-600/25 rounded-full blur-2xl pointer-events-none"></div>

    <!-- Top Part: Logo & Navigation List -->
    <div class="flex flex-col h-full overflow-hidden relative z-10">
      <!-- App Brand / Header in Sidebar -->
      <div class="h-14 px-4 flex items-center justify-between border-b border-white/15 shrink-0 bg-black/5 backdrop-blur-xs">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg bg-white/20 backdrop-blur-md flex items-center justify-center border border-white/30 shadow-inner">
            <i data-lucide="database" class="w-4 h-4 text-white"></i>
          </div>
          <div>
            <h1 class="font-bold text-base tracking-wide leading-tight text-white drop-shadow-xs">SD Data</h1>
            <p class="text-[10px] text-amber-100/90 leading-none">ប្រព័ន្ធគ្រប់គ្រង ERP</p>
          </div>
        </div>
        <!-- Close button on Mobile -->
        <button onclick="closeSidebar()" class="md:hidden p-1.5 rounded-lg text-amber-100 hover:text-white hover:bg-white/15 transition-colors" aria-label="បិទម៉ឺនុយ">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Navigation Modules List -->
      <nav class="flex-1 px-2.5 py-3 overflow-y-auto space-y-1" id="nav-list">
        <!-- Rendered by JavaScript -->
      </nav>
    </div>

    <!-- Bottom Part: User Profile Card -->
    <div class="p-3 border-t border-white/15 bg-black/10 backdrop-blur-xs shrink-0 relative z-10">
      <div class="flex items-center gap-2.5 px-2 py-1.5 rounded-lg bg-white/10 backdrop-blur-sm border border-white/15">
        <div class="w-8 h-8 rounded-full bg-white text-[#EA580C] flex items-center justify-center font-bold text-xs shrink-0 shadow-sm">
          <span>SD</span>
        </div>
        <div class="min-w-0 flex-1">
          <p class="text-xs font-semibold text-white truncate">អ្នកគ្រប់គ្រងប្រព័ន្ធ</p>
          <p class="text-[11px] text-amber-100/90 truncate">admin@sd-data.kh</p>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Content Layout Area (Takes remaining width properly on desktop & 100% width on mobile) -->
  <div class="flex-1 flex flex-col w-full min-w-0 h-screen overflow-hidden">
    
    <!-- Top Header -->
    <header class="h-14 bg-white border-b border-slate-200 flex items-center justify-between px-3 md:px-6 shrink-0 z-10 shadow-[0_1px_2px_rgba(0,0,0,0.03)] w-full">
      <div class="flex items-center gap-2.5 min-w-0">
        <!-- Mobile Toggle Button -->
        <button onclick="openSidebar()" 
                class="md:hidden p-2 rounded-lg text-slate-600 hover:text-slate-900 hover:bg-slate-100 focus:outline-none shrink-0"
                aria-label="បើកម៉ឺនុយ">
          <i data-lucide="menu" class="w-5 h-5"></i>
        </button>
        
        <!-- Current Module Title & Breadcrumb -->
        <div class="flex items-center gap-1.5 min-w-0">
          <span id="header-icon-container" class="text-[#B91C1C] p-1 bg-red-50 rounded hidden sm:inline-flex shrink-0"></span>
          <h2 id="header-title" class="font-bold text-slate-800 text-sm sm:text-base leading-tight truncate">ផ្ទាំងសង្ខេប</h2>
        </div>
      </div>

      <div class="flex items-center gap-1.5 sm:gap-3 shrink-0">
        <!-- Live Data Status Badge & Refresh Button -->
        <div id="header-status-badge" class="flex items-center gap-1.5 sm:gap-2">
          <div class="flex items-center gap-1.5 px-2 py-0.5 sm:px-2.5 sm:py-1 rounded-full bg-slate-100 text-slate-600 border border-slate-200 text-[11px] sm:text-xs">
            <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
            <span>កំពុងភ្ជាប់...</span>
          </div>
        </div>

        <div class="h-4 w-px bg-slate-200 hidden sm:block"></div>

        <!-- Quick Info Date (Asia/Phnom_Penh) -->
        <div class="text-xs text-slate-500 hidden md:block" id="current-date-badge"></div>
      </div>
    </header>

    <!-- Main Dynamic Content Container -->
    <main class="flex-1 overflow-y-auto p-2.5 sm:p-5 md:p-6 bg-slate-50/60 w-full" id="main-content">
      <!-- Injected dynamically based on active module -->
    </main>
  </div>

  <script src="dataService.js"></script>
  <script src="app.js"></script>
</body>
</html>
