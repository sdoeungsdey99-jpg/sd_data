  <!-- Google Fonts: Kantumruy Pro, Plus Jakarta Sans -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Kantumruy Pro"', '"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"Plus Jakarta Sans"', 'monospace'],
          },
          colors: {
            brand: {
              gold: '#F59E0B',
              orange: '#F97316',
              dark: '#070D18',
              card: '#0F1B2E',
              border: '#1E2D4A'

          }
        }

  <style>
    body {
      background-color: #060B14;
      color: #F1F5F9;
      font-family: 'Kantumruy Pro', sans-serif;
      overflow-x: hidden;
    }
    .glass-card {
      background: linear-gradient(135deg, rgba(15, 27, 46, 0.85) 0%, rgba(10, 20, 36, 0.95) 100%);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 12px 36px -8px rgba(0, 0, 0, 0.6);
    }
    .iphone-frame {
      width: 295px;
      height: 610px;
      border-radius: 44px;
      border: 7px solid #1E293B;
      box-shadow: 0 0 0 2px #0F172A, 0 25px 60px -15px rgba(0, 0, 0, 0.9), 0 0 35px rgba(249, 115, 22, 0.2);
      position: relative;
      background: #000;
      overflow: hidden;
      flex-shrink: 0;
    }
    @media (min-width: 1024px) {
      .iphone-frame {
        width: 315px;
        height: 650px;
      }
    }
    .dynamic-island {
      width: 85px;
      height: 22px;
      background: #000;
      border-radius: 20px;
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
    }
    .glow-orange {
      background: radial-gradient(circle, rgba(249, 115, 22, 0.22) 0%, transparent 70%);
    }
    .glow-blue {
      background: radial-gradient(circle, rgba(14, 165, 233, 0.2) 0%, transparent 70%);
    }
    .slide-enter {
      animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    /* Print to PDF */
    @media print {
      body { background: white !important; color: black !important; }
      #top-navbar, #bottom-dock, #thumbnail-drawer, #action-buttons { display: none !important; }
      .slide-container { display: flex !important; page-break-after: always; min-height: 100vh; padding: 20px 0; }
      .glass-card { border: 1px solid #ccc !important; box-shadow: none !important; background: #fafafa !important; color: #111 !important; }
      .iphone-frame { box-shadow: none !important; border-color: #333 !important; }
    }
  </style>
</head>

          '**ប័ណ្ណសរសើរចំណាត់ថ្នាក់ស្វ័យប្រវត្តិ (Certificates Rank 1, 2, 3)៖** ចេញប័ណ្ណកិត្តិយសដោយផ្ទាល់ពីប្រព័ន្ធ មានឈ្មោះ រូបថត និងសមិទ្ធផលច្បាស់ៗ។',
          '**វត្តមានការងារផ្ទៀងផ្ទាត់ GPS (Office Attendance)៖** ធានាវិន័យការងារចូលបំពេញការងារ និងប្រជុំប្រចាំសប្តាហ៍។',
          '**សេចក្តីជូនដំណឹង និងការលើកទឹកចិត្ត៖** ផ្សព្វផ្សាយសមិទ្ធផលចូលក្នុងក្រុម Telegram បង្កើតមោទនភាព និងកម្លាំងចិត្តធ្វើការ។',
          '**កសាងវប្បធម៌ស្ថាប័នរឹងមាំ៖** ធ្វើឱ្យ Bostar Group ក្លាយជាស្ថាប័នដែលមានស្តង់ដារវិជ្ជាជីវៈខ្ពស់។'
        ],
        formula: '🎖️ ទទួលស្គាល់ការខិតខំប្រឹងប្រែង = ក្រុមការងារមានថាមពលសម្រេចគោលដៅ 3,000+ ប្រអប់!'
      },
      {
        id: 'summary',
        badge: 'សកម្មភាពបន្ទាប់ • CALL TO ACTION',
        badgeColor: 'emerald',
        title: 'រួមគ្នាកត់ត្រាឱ្យបានត្រឹមត្រូវ ដើម្បីប្រាក់ចំណេញ និងរង្វាន់ធំទាំងអស់គ្នា!',
        subtitle: '៣ ជំហានសាមញ្ញដើម្បីចាប់ផ្តើមប្រើប្រាស់ SD Data ERP លើទូរស័ព្ទដៃ',
        img: 'slides_assets/01_dashboard_hero.png',
        points: [
          '**ជំហានទី ១ (Add to Home Screen)៖** បើក Link លើ Safari (iPhone) ឬ Chrome (Android) $\\rightarrow$ ចុច Share $\\rightarrow$ ចុច «Add to Home Screen»។',
          '**ជំហានទី ២ (សាកល្បងបញ្ចូល Order)៖** សាកល្បងចុចបញ្ចូលកុម្ម៉ង់ប្រូម៉ូសិន ៤ ថែម ១ និងឆែកមើលបញ្ជីអតិថិជនចាស់របស់ខ្លួន។',
          '**ជំហានទី ៣ (វាយលុកយុទ្ធនាការ)៖** ចាប់ផ្តើម Follow up ភ្ញៀវចាស់ ២៥ នាក់/ម្នាក់ និងពង្រាយ Ads 10 Ads/ម្នាក់ ដើម្បីដេញយករង្វាន់ $500 & $100!',
          '**សារដាស់តឿន៖** «កត់ត្រាបានច្បាស់លាស់ ស្មើនឹងលុយនៅក្នុងដៃច្បាស់លាស់!»'
        ],
        formula: '🚀 ឆ្ពោះទៅសម្រេច 3,000+ ប្រអប់ និងដណ្តើមប្រាក់រង្វាន់រាប់ពាន់ដុល្លារទាំងអស់គ្នា!'
      }
    ];

    let currentSlide = 0;

    function renderSlide(index) {
      if (index < 0) index = 0;
      if (index >= slidesData.length) index = slidesData.length - 1;
      currentSlide = index;

      const slide = slidesData[index];

      // Update Header/Footer info
      document.getElementById('current-slide-num').textContent = String(index + 1).padStart(2, '0');
      document.getElementById('total-slides-num').textContent = String(slidesData.length).padStart(2, '0');
      document.getElementById('slide-title-preview').textContent = slide.title;

      const stage = document.getElementById('slide-stage');
      stage.innerHTML = `
        <div class="slide-container w-full grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-10 items-center slide-enter">
          
          <!-- LEFT: Real App Retina Screenshot inside iPhone Mockup (5 cols) -->
          <div class="lg:col-span-5 flex justify-center items-center">
            <div class="iphone-frame group relative">
              <!-- Dynamic Island -->
              <div class="dynamic-island flex items-center justify-between px-2.5">
                <span class="w-2.5 h-2.5 rounded-full bg-slate-900 border border-slate-700/60"></span>
                <span class="w-2 h-2 rounded-full bg-emerald-500/80 animate-pulse"></span>
              </div>
              
              <!-- Real Retina Screenshot -->
              <img src="${slide.img}" 
                   alt="${slide.title}" 
                   class="w-full h-full object-cover object-top transition duration-500 group-hover:scale-[1.02] cursor-pointer"
                   onclick="zoomImage('${slide.img}')"
                   title="ចុចដើម្បីមើលរូបភាពធំ">

              <!-- Click to zoom hint overlay -->
              <div class="absolute bottom-4 inset-x-4 py-1.5 px-3 rounded-full bg-black/60 backdrop-blur-md text-center text-[10px] text-slate-300 pointer-events-none opacity-0 group-hover:opacity-100 transition">
                🔍 ចុចលើរូបភាពដើម្បីមើលទំហំធំ
              </div>
            </div>
          </div>

          <!-- RIGHT: Rich Narrative & Benefits Card (7 cols) -->
          <div class="lg:col-span-7 flex flex-col justify-center space-y-4">
            
            <!-- Badge -->
            <div class="flex items-center gap-2">
              <span class="px-3 py-1 rounded-full text-xs font-bold font-mono tracking-wider bg-orange-500/20 text-orange-400 border border-orange-500/40">
                ${slide.badge}
              </span>
              <span class="text-xs text-slate-500 font-mono">SLIDE ${String(index + 1).padStart(2, '0')}</span>
            </div>

            <!-- Title & Subtitle -->
            <div>
              <h2 class="text-xl sm:text-2xl md:text-3xl font-extrabold text-white leading-snug tracking-tight">
                ${slide.title}
              </h2>
              <p class="text-sm sm:text-base text-slate-300 font-medium mt-1">
                ${slide.subtitle}
              </p>
            </div>

            <!-- Bullet Points -->
            <div class="glass-card rounded-2xl p-4 sm:p-5 border border-white/10 space-y-3">
              ${slide.points.map(pt => {
                // parse simple markdown bold **text**
                const formatted = pt.replace(/\\\$/g, '$').replace(/\*\*(.*?)\*\*/g, '<strong class="text-white font-semibold">$1</strong>');
                return `
                  <div class="flex items-start gap-2.5 text-xs sm:text-sm text-slate-300 leading-relaxed">
                    <div class="w-5 h-5 rounded-full bg-orange-500/20 border border-orange-500/30 flex items-center justify-center shrink-0 mt-0.5">
                      <i data-lucide="check" class="w-3.5 h-3.5 text-orange-400"></i>
                    </div>
                    <div>${formatted}</div>
                  </div>
                `;
              }).join('')}
            </div>

            <!-- Formula / Key Takeaway Box -->
            <div class="p-3.5 rounded-xl bg-gradient-to-r from-amber-500/15 via-orange-500/15 to-transparent border-l-4 border-orange-500 text-xs sm:text-sm text-amber-200 font-medium">
              ${slide.formula}
            </div>

            <!-- Next Slide Shortcut -->
            <div class="pt-1 flex items-center justify-between text-xs text-slate-400">
              <span>ចុចគ្រាប់ចុច <strong>←</strong> / <strong>→</strong> ឬ Spacebar ដើម្បីបញ្ជាស្លាយ</span>
              <button onclick="nextSlide()" class="text-orange-400 hover:text-orange-300 font-semibold flex items-center gap-1 transition">
                <span>បន្ទាប់</span>
                <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
              </button>
            </div>

          </div>

        </div>
      `;

      if (window.lucide) window.lucide.createIcons();
    }

    function prevSlide() {
      if (currentSlide > 0) renderSlide(currentSlide - 1);
    }

    function nextSlide() {
      if (currentSlide < slidesData.length - 1) renderSlide(currentSlide + 1);
    }

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        prevSlide();
      } else if (e.key === 'Escape') {
        const modal = document.getElementById('thumbnail-drawer');
        if (modal && !modal.classList.contains('hidden')) toggleThumbnails();
      }
    });

    // Thumbnails Drawer
    function toggleThumbnails() {
      const drawer = document.getElementById('thumbnail-drawer');
      const isHidden = drawer.classList.contains('hidden');
      if (isHidden) {
        drawer.classList.remove('hidden');
        renderThumbnails();
      } else {
        drawer.classList.add('hidden');
      }
    }

    function renderThumbnails() {
      const grid = document.getElementById('thumbnail-grid');
      grid.innerHTML = slidesData.map((s, idx) => `
        <div onclick="selectSlide(${idx})" class="p-2.5 rounded-xl border ${currentSlide === idx ? 'border-orange-500 bg-orange-500/20 ring-2 ring-orange-500/30' : 'border-white/10 bg-white/5 hover:bg-white/10'} cursor-pointer transition flex flex-col items-center text-center">
          <div class="w-full h-24 rounded-lg bg-black/60 overflow-hidden mb-2 relative flex items-center justify-center border border-white/10">
            <img src="${s.img}" alt="${s.title}" class="w-full h-full object-cover object-top opacity-80 hover:opacity-100 transition">
            <span class="absolute top-1 left-1 px-1.5 py-0.5 rounded bg-black/70 text-[9px] font-mono text-orange-400 font-bold">${String(idx + 1).padStart(2, '0')}</span>
          </div>
          <span class="text-[11px] font-bold text-white line-clamp-1">${s.title}</span>
          <span class="text-[9px] text-slate-400 font-mono mt-0.5">${s.badge.split('•')[0]}</span>
        </div>
      `).join('');
    }

    function selectSlide(idx) {
      toggleThumbnails();
      renderSlide(idx);
    }

    // Fullscreen Toggle
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    // Simple Image Zoom Modal
    function zoomImage(src) {
      window.open(src, '_blank');
    }

    // Initial render
    renderSlide(0);
  </script>
</body>
</html>
